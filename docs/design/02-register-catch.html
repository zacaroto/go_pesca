<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0 font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-dim border-b-4 border-outline-variant dark:border-outline shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] flex justify-between items-center px-margin-mobile py-stack-sm w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<h1 class="font-display-lg text-headline-md text-primary dark:text-primary-fixed tracking-tight">Go Pesca</h1>
<button class="hover:scale-105 transition-transform active:translate-y-0.5 active:translate-x-0.5 transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">notifications</span>
</button>
</header>
<main class="max-w-3xl mx-auto px-gutter py-stack-lg">
<!-- Progress Indicator -->
<div class="flex justify-between items-center mb-8 px-4">
<div class="flex gap-2 items-center">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-lg font-bold chunky-border">1</div>
<div class="w-12 h-2 bg-primary rounded-full border-2 border-on-surface"></div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-lg font-bold chunky-border">2</div>
<div class="w-12 h-2 bg-surface-container-highest rounded-full border-2 border-on-surface opacity-50"></div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-lg font-bold chunky-border opacity-50">3</div>
</div>
<span class="font-label-lg text-primary-container">Paso 1 de 3</span>
</div>
<h2 class="font-headline-lg text-headline-lg mb-6 text-on-surface">¡Nueva Captura! 🎣</h2>
<!-- Card Container -->
<div class="bg-card-bg rounded-3xl chunky-border chunky-shadow p-stack-md md:p-stack-lg flex flex-col gap-8">
<!-- Photo Upload Area (Sticker Frame) -->
<section>
<label class="font-headline-md text-headline-md text-on-surface mb-4 block">Foto del Trofeo</label>
<div class="relative w-full aspect-video md:aspect-[21/9] bg-surface-container-low rounded-2xl chunky-border border-dashed flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors group">
<div class="w-16 h-16 bg-primary-fixed text-on-primary-fixed rounded-full flex items-center justify-center chunky-border mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
</div>
<span class="font-label-lg text-label-lg text-primary">Toca para añadir foto</span>
<span class="font-body-sm text-on-surface-variant mt-1 text-sm">¡Muestra tu mejor lado!</span>
<!-- Decorative Sticker -->
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-sunny-yellow rounded-full chunky-border flex items-center justify-center rotate-12 shadow-sm">
<span class="material-symbols-outlined text-on-surface">star</span>
</div>
</div>
</section>
<!-- Species Input -->
<section>
<label class="font-headline-md text-headline-md text-on-surface mb-4 block">¿Qué picó?</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest font-body-lg text-body-lg text-on-surface rounded-2xl chunky-border p-4 pl-12 focus:outline-none focus:ring-4 focus:ring-secondary-container focus:border-secondary transition-all" placeholder="Ej. Dorado, Róbalo..." type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-2xl">search</span>
</div>
<!-- Quick Tags -->
<div class="flex flex-wrap gap-2 mt-4">
<button class="bg-primary-container text-on-primary-container font-label-sm px-4 py-2 rounded-full chunky-border btn-press transition-transform">Atún</button>
<button class="bg-tertiary-container text-on-tertiary-container font-label-sm px-4 py-2 rounded-full chunky-border btn-press transition-transform">Pargo</button>
<button class="bg-surface-container-high text-on-surface font-label-sm px-4 py-2 rounded-full chunky-border btn-press transition-transform">Desconocido 🤷</button>
</div>
</section>
<!-- Weather & Conditions (Power-ups) -->
<section>
<label class="font-headline-md text-headline-md text-on-surface mb-4 block">Condiciones</label>
<div class="grid grid-cols-3 gap-4 mb-4">
<button class="flex flex-col items-center justify-center bg-sunny-yellow/20 rounded-2xl p-4 chunky-border btn-press powerup-icon transition-all focus:bg-sunny-yellow/50">
<span class="material-symbols-outlined text-4xl text-on-surface mb-2" style="font-variation-settings: 'FILL' 1;">light_mode</span>
<span class="font-label-sm text-on-surface">Soleado</span>
</button>
<button class="flex flex-col items-center justify-center bg-outline-variant/30 rounded-2xl p-4 chunky-border btn-press powerup-icon transition-all focus:bg-outline-variant/60">
<span class="material-symbols-outlined text-4xl text-on-surface mb-2" style="font-variation-settings: 'FILL' 1;">cloud</span>
<span class="font-label-sm text-on-surface">Nublado</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-fixed/50 rounded-2xl p-4 chunky-border btn-press powerup-icon transition-all focus:bg-primary-fixed">
<span class="material-symbols-outlined text-4xl text-primary mb-2" style="font-variation-settings: 'FILL' 1;">rainy</span>
<span class="font-label-sm text-primary">Lluvia</span>
</button>
</div>
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 bg-secondary-fixed-dim/30 rounded-2xl p-3 chunky-border btn-press">
<span class="material-symbols-outlined text-on-secondary-fixed-variant">water</span>
<span class="font-label-lg text-on-secondary-fixed-variant">Marea Alta</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container-high rounded-2xl p-3 chunky-border btn-press">
<span class="material-symbols-outlined text-outline">waves</span>
<span class="font-label-lg text-outline">Marea Baja</span>
</button>
</div>
</section>
<!-- Stats (Weight/Length) -->
<section class="grid grid-cols-2 gap-4">
<div>
<label class="font-label-lg text-label-lg text-on-surface-variant mb-2 block">Peso (kg)</label>
<input class="w-full bg-surface-container-lowest font-body-lg text-body-lg text-on-surface rounded-2xl chunky-border p-4 focus:outline-none focus:ring-4 focus:ring-secondary-container transition-all text-center" placeholder="0.0" type="number"/>
</div>
<div>
<label class="font-label-lg text-label-lg text-on-surface-variant mb-2 block">Longitud (cm)</label>
<input class="w-full bg-surface-container-lowest font-body-lg text-body-lg text-on-surface rounded-2xl chunky-border p-4 focus:outline-none focus:ring-4 focus:ring-secondary-container transition-all text-center" placeholder="0" type="number"/>
</div>
</section>
</div>
<!-- Next / Finish Action -->
<div class="mt-8 flex justify-end">
<button class="gradient-sunset text-on-primary font-headline-lg text-headline-md px-8 py-4 rounded-full chunky-border chunky-shadow btn-press transition-all flex items-center gap-2">
                Siguiente
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-gutter pb-4 bg-surface-container-highest dark:bg-surface-container border-t-4 border-outline-variant dark:border-outline shadow-[0px_-4px_0px_0px_rgba(0,0,0,0.05)] rounded-t-lg z-50">

<span class="font-label-sm text-label-sm uppercase font-bold">Home</span>
</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant p-stack-sm opacity-80 hover:brightness-110 active:scale-95 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined text-2xl mb-1">style</span>
<span class="font-label-sm text-label-sm uppercase font-bold">Pescadex</span>
</a>

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl p-stack-sm scale-110 -translate-y-2 border-2 border-secondary hover:brightness-110 active:scale-95 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">question_mark</span>
<span class="font-label-sm text-label-sm uppercase font-bold">Log</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-stack-sm opacity-80 hover:brightness-110 active:scale-95 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined text-2xl mb-1">person</span>
<span class="font-label-sm text-label-sm uppercase font-bold">Profile</span>
</a>
