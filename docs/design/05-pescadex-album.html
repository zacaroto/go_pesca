<style>
        .border-chunky { border-width: 3px; }
        
        /* Holographic Shimmer Effect */
        .holo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                transparent 20%,
                rgba(255, 255, 255, 0.6) 35%,
                rgba(37, 254, 168, 0.4) 45%, /* secondary-container tint */
                rgba(255, 214, 10, 0.4) 55%,  /* sunny-yellow tint */
                transparent 70%
            );
            background-size: 250% 100%;
            animation: holo-shimmer 4s infinite linear;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes holo-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -100% 0; }
        }

        /* Liquid Tube Progress Bar */
        .liquid-tube {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.15) 0px,
                rgba(255, 255, 255, 0.15) 10px,
                transparent 10px,
                transparent 20px
            );
            background-size: 28px 28px;
            animation: move-stripes 2s linear infinite;
            box-shadow: inset 0 4px 6px -1px rgba(255, 255, 255, 0.5), inset 0 -4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }

        /* Floating Animation for Badges */
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
